name: Validate Fleet Telemetry Manager
on:
  push:
    branches:
      - main
      - feat/telemetry-manager-mvp
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static validation
        run: |
          node scripts/verify.mjs
          node scripts/verify-incidents.mjs
          node scripts/verify-mileage.mjs
          node scripts/verify-mileage-pdf.mjs
          node scripts/verify-mileage-daily.mjs
          node scripts/verify-mileage-group-focus.mjs
          node scripts/verify-hosting.mjs
          node scripts/verify-geotab-unique-routes.mjs
          node scripts/verify-geotab-runtime.mjs
          node scripts/verify-live-origin.mjs
