name: Package six real Geotab modules
on:
  push:
    branches:
      - fix/geotab-six-real-pages-files-v0.4.9
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build full Add-In Files package
        run: |
          node scripts/build-geotab-files-package.mjs
          node scripts/verify-geotab-files-package.mjs
      - name: Zip files for MyGeotab
        shell: bash
        run: |
          cd dist-geotab
          cd pages
          zip -q -r ../fleet-telemetry-files-v0.4.9.zip *.html icon.svg translations
          cd ..
          zip -q fleet-telemetry-completo-v0.4.9.zip configuration.json
          (cd pages && zip -q -r ../fleet-telemetry-completo-v0.4.9.zip *.html icon.svg translations)
          unzip -t fleet-telemetry-files-v0.4.9.zip
          unzip -t fleet-telemetry-completo-v0.4.9.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FleetTelemetryManager-v0.4.9
          if-no-files-found: error
          retention-days: 30
          path: |
            dist-geotab/configuration.json
            dist-geotab/LEIA-ME.txt
            dist-geotab/fleet-telemetry-files-v0.4.9.zip
            dist-geotab/fleet-telemetry-completo-v0.4.9.zip
            dist-geotab/pages/
