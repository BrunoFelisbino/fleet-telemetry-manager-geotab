<style data-bundle="exceptions/audit.css">
/* Janela de auditoria do Fleet Exception 360 */
#auditDialog { color:#172033; width:min(1120px,calc(100vw - 22px)); max-width:1120px;

.audit-shell{display:flex;flex-direction:column;max-height:min(90dvh,950px);font-family:system-ui,'Segoe UI',sans-serif}
.audit-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 14px;border-bottom:1px solid #e2e8f0}
.audit-header h2{font-size:22px;margin:0;color:#102a43;font-weight:800;line-height:1.2}

.audit-close{flex:none;min-height:40px;min-width:40px;border-radius:12px;background:#edf2f6;border:1px solid #d2dce6;color:#243b53;font-size:19px;cursor:pointer}

.audit-table th{font-size:11px;color:#42566a;font-weight:800}
